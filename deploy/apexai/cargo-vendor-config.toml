# Build-only Cargo source map for offline Linux builds.
# Copy this file to <build-root>/.cargo/config.toml after unpacking vendor/.

[source.crates-io]
replace-with = "vendored-sources"

[source."git+https://github.com/helix-editor/nucleo.git?rev=5b74652"]
