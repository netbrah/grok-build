[source.crates-io]
replace-with = "vendored-sources"

[source."git+https://github.com/helix-editor/nucleo.git?rev=5b74652"]
git = "https://github.com/helix-editor/nucleo.git"
rev = "5b74652"
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
