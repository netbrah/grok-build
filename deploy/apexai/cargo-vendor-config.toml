rev = "5b74652"
replace-with = "vendored-sources"

[source."git+https://github.com/our-forks/async-openai.git?rev=95b52ebdedf42143083cf3d6f0e0be7c84e9c808"]
git = "https://github.com/our-forks/async-openai.git"
rev = "95b52ebdedf42143083cf3d6f0e0be7c84e9c808"
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
