[package]
license = "Apache-2.0"
name = "xai-grok-models"
version = "0.1.0"
edition.workspace = true
description = "Default model IDs for the grok CLI, loaded from the embedded default_models.json."

[build-dependencies]
# ZC-PARAMSCHEMA-GATE-1 (apex-ayl.130): the build-time param gate parses
# config.schema.json.
serde_json = { workspace = true }

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# CATALOG-BAKE-1 (apex-071, D2): the enriched rows type their wire fields
# with the shared sampling types (no new external crates; the shell
# already depends on this sibling).
xai-grok-sampling-types = { path = "../xai-grok-sampling-types" }

[lints]
workspace = true
